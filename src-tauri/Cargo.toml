[package]
name = "cvec"
version = "0.1.0"
edition = "2021"
description = "A quiet local dependency vulnerability watcher for macOS-first developers"
homepage = "https://cvec.app"
repository = "https://github.com/swolg/cvec-app"
license = "MIT"
default-run = "cvec"

[lib]
name = "cvec"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[features]
performance-profiler = ["tauri/devtools"]

[dependencies]
caseless = "0.2.2"
deno_semver = "0.10.1"
futures = "0.3.32"
getrandom = "0.4.2"
keyring-core = "1.0.0"
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.41.0", features = ["bundled", "functions"] }
time = { version = "0.3.49", features = ["formatting", "macros", "parsing"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
sha2 = "0.11.1"
tauri = { version = "2.12.4", default-features = false, features = [
    "common-controls-v6",
    "image-png",
    "macos-private-api",
    "tray-icon",
    "wry",
] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-window-state = "2.5.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"
tokio = { version = "1.52.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
unicode-normalization = "0.1.26"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }
