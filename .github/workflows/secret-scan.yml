name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan checked-out history for secrets
        shell: bash
        run: |
          scanner_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXXXX")"
          trap 'rm -rf -- "$scanner_dir"' EXIT
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" \
            --output "$scanner_dir/$archive"
          (
            cd "$scanner_dir"
            printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check
            tar -xzf "$archive" gitleaks
          )
          "$scanner_dir/gitleaks" git --config .gitleaks.toml --redact=100 --log-opts=HEAD .
