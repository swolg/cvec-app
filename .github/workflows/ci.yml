name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Desktop frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: git diff --exit-code -- package-lock.json
      - run: npm run dependency:check
      - name: OSV lockfile scan
        run: |
          scanner_dir=$(mktemp -d "$RUNNER_TEMP/osv-scanner.XXXXXXXX")
          trap 'rm -rf -- "$scanner_dir"' EXIT
          curl -fsSL --retry 3 --max-time 60 -o "$scanner_dir/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          printf '%s  %s\n' '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b' "$scanner_dir/osv-scanner" | sha256sum --check
          chmod +x "$scanner_dir/osv-scanner"
          PATH="$scanner_dir:$PATH" node scripts/check-osv-results.mjs
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm run sbom
      - run: npm run sbom:check
      - name: Upload commit-bound SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: artifacts/security/*.cdx.json
          if-no-files-found: error

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: ./scripts/cargo-audit.sh --deny warnings
      - name: Release performance fixtures
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --locked --bin cvec-perf
          src-tauri/target/release/cvec-perf matrix /tmp/cvec-perf-ci 30 > /tmp/cvec-perf-ci.jsonl
          node scripts/check-performance.mjs /tmp/cvec-perf-ci.jsonl
      - name: Upload performance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ github.sha }}
          path: /tmp/cvec-perf-ci.jsonl
